name: shellcheck
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -S warning neo-pimpmykali.sh lib/*.sh modules/*.sh dotfiles/pentest.bashrc
  dry-run:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - uses: actions/checkout@v4
      - name: dry run
        run: ./neo-pimpmykali.sh --dry-run --all
