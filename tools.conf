# neo-pimpmykali tool list
#
# category | name | apt package | fallback method | fallback source | binary to check
#
# The apt package is tried first (Kali ships most of these). If it is empty or not in
# your repos, the fallback is used:
#   pipx / uv  -> PyPI name or git+https URL
#   go         -> module@version
#   gh         -> "owner/repo asset-regex" (latest GitHub release into ~/.local/bin)
#   func       -> a shell function defined in modules/tools.sh
#   none       -> apt only, skipped elsewhere
# Adding a tool = adding one line.

# --- AD / internal ---
ad    | netexec            | netexec            | pipx | git+https://github.com/Pennyw0rth/NetExec | nxc
ad    | impacket           |                    | pipx | impacket                                    | secretsdump.py
ad    | bloodhound-ce      |                    | func | install_bloodhound_ce                       | bloodhound-cli
ad    | bloodhound-ce-py   | bloodhound-ce-python | pipx | bloodhound-ce                             | bloodhound-ce-python
ad    | certipy            | certipy-ad         | pipx | certipy-ad                                  | certipy
ad    | bloodyAD           | bloodyad           | pipx | bloodyAD                                    | bloodyAD
ad    | evil-winrm-py      |                    | pipx | evil-winrm-py                               | evil-winrm-py
ad    | coercer            | coercer            | pipx | coercer                                     | coercer
ad    | pywhisker          |                    | pipx | git+https://github.com/ShutdownRepo/pywhisker | pywhisker
ad    | kerbrute           |                    | go   | github.com/ropnop/kerbrute@latest           | kerbrute
ad    | ligolo-ng          | ligolo-ng          | func | install_ligolo                              | ligolo-proxy
ad    | sliver             | sliver             | func | install_sliver                              | sliver-server
ad    | responder          | responder          | none |                                             | responder

